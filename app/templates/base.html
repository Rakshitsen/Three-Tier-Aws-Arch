<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Cloud Media App" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cloud Media App</h1>
            <p>Employee Management System</p>
        </div>

        <!-- Navigation Menu -->
        <div class="nav-menu">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">📝 Register</a>
            <a href="/get_employee" class="nav-link {% if request.path == '/get_employee' %}active{% endif %}">🔍 Find Employee</a>
        </div>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
